<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台登录 · GlobalShop</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: #f5f6f8; color: #1f2329;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        .card {
            width: 360px; background: #fff; border: 1px solid #e7e8ec; border-radius: 16px;
            padding: 28px; box-shadow: 0 10px 40px rgba(20,24,40,.08);
        }
        h1 { font-size: 18px; margin: 0 0 4px; }
        p.sub { color: #8b8f99; font-size: 13px; margin: 0 0 20px; }
        label { font-size: 12px; color: #6b6f79; display: block; margin-bottom: 6px; }
        input[type="password"] {
            width: 100%; height: 40px; padding: 0 12px; border: 1px solid #d9dbe1;
            border-radius: 10px; font-size: 14px; outline: none;
        }
        input[type="password"]:focus { border-color: #4d6bfe; box-shadow: 0 0 0 3px #eaefff; }
        button {
            width: 100%; height: 40px; margin-top: 16px; border: none; border-radius: 10px;
            background: #4d6bfe; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
        }
        button:hover { background: #3f5ae0; }
        .error { margin-top: 14px; font-size: 13px; color: #e5484d; }
    </style>
</head>
<body>
    <form class="card" method="post" action="/admin/login">
        <h1>GlobalShop 管理后台</h1>
        <p class="sub">请输入管理员密码</p>
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autofocus autocomplete="current-password">
        <button type="submit">登录</button>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
    </form>
</body>
</html>
