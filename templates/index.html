<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalShop AI 客服中心</title>
    <style>
        :root {
            --bg: #ffffff;
            --bg-sidebar: #f8f8fa;
            --bg-hover: #f1f2f4;
            --bg-active: #e9edff;
            --bg-composer: #ffffff;
            --bg-user: #eef2ff;
            --text: #1f2329;
            --text-muted: #8b8f99;
            --text-faint: #b0b4bd;
            --border: #e7e8ec;
            --border-strong: #d9dbe1;
            --brand: #4d6bfe;
            --brand-soft: #eaefff;
            --danger: #e5484d;
            --shadow: 0 6px 24px rgba(20, 24, 40, .08);
            --radius: 12px;
        }
        [data-theme="dark"] {
            --bg: #1b1c1f;
            --bg-sidebar: #141517;
            --bg-hover: #24262b;
            --bg-active: #232a4d;
            --bg-composer: #232428;
            --bg-user: #26304f;
            --text: #e8e9ec;
            --text-muted: #9a9ea8;
            --text-faint: #6b6f79;
            --border: #2b2d33;
            --border-strong: #3a3d45;
            --brand: #7b93ff;
            --brand-soft: #232a4d;
            --shadow: 0 6px 24px rgba(0, 0, 0, .35);
        }

        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                         "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }
        button { font-family: inherit; cursor: pointer; }
        button:disabled { cursor: not-allowed; opacity: .45; }

        /* ---------- layout ---------- */
        .app { display: flex; height: 100vh; overflow: hidden; }

        /* ---------- sidebar ---------- */
        .sidebar {
            width: 260px;
            flex: 0 0 260px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: width .18s ease, flex-basis .18s ease;
            overflow: hidden;
        }
        .app.collapsed .sidebar { width: 0; flex-basis: 0; border-right: none; }

        .sidebar-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 12px 8px;
        }
        .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; letter-spacing: -0.2px; }
        .brand svg { width: 22px; height: 22px; color: var(--brand); }
        .brand span { white-space: nowrap; }
        .side-actions { display: flex; gap: 2px; }

        .icon-btn {
            width: 30px; height: 30px;
            display: inline-flex; align-items: center; justify-content: center;
            border: none; background: transparent; color: var(--text-muted);
            border-radius: 8px;
        }
        .icon-btn:hover { background: var(--bg-hover); color: var(--text); }
        .icon-btn svg { width: 17px; height: 17px; }

        .search-wrap { padding: 4px 12px 8px; display: none; }
        .search-wrap.open { display: block; }
        .search-input {
            width: 100%; height: 34px; padding: 0 12px;
            border: 1px solid var(--border-strong); border-radius: 9px;
            background: var(--bg); color: var(--text); font-size: 13px; outline: none;
        }
        .search-input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }

        .new-chat {
            margin: 6px 12px 12px;
            height: 40px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            border: 1px solid var(--border-strong);
            background: var(--bg); color: var(--text);
            border-radius: 999px; font-size: 14px; font-weight: 500;
            transition: background .15s, border-color .15s;
        }
        .new-chat:hover { background: var(--bg-hover); border-color: var(--border-strong); }
        .new-chat svg { width: 16px; height: 16px; }

        .session-list { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
        .session-group-label {
            font-size: 12px; color: var(--text-faint);
            padding: 12px 8px 4px; font-weight: 500;
        }
        .session-item {
            position: relative;
            display: flex; align-items: center; gap: 6px;
            padding: 8px 8px 8px 10px;
            margin: 1px 0;
            border-radius: 9px;
            font-size: 13.5px;
            color: var(--text);
            cursor: pointer;
            overflow: hidden;
        }
        .session-item:hover { background: var(--bg-hover); }
        .session-item.active { background: var(--bg-active); color: var(--text); }
        .session-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        /* 会话状态点：蓝色脉冲=思考中，绿色=已答完未查看 */
        .session-status {
            width: 7px; height: 7px; border-radius: 50%;
            flex: 0 0 auto; margin-right: 2px;
        }
        .session-status.thinking {
            background: var(--brand);
            animation: statusPulse 1.1s infinite ease-in-out;
        }
        .session-status.done { background: #12a150; }
        @keyframes statusPulse {
            0%, 100% { opacity: .35; transform: scale(.75); }
            50% { opacity: 1; transform: scale(1.15); }
        }
        .session-actions { display: none; gap: 2px; flex: 0 0 auto; }
        .session-item:hover .session-actions { display: flex; }
        .session-item.active .session-actions { display: flex; }
        .mini-btn {
            width: 24px; height: 24px; border: none; background: transparent;
            color: var(--text-muted); border-radius: 6px;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .mini-btn:hover { background: var(--bg); color: var(--text); }
        .mini-btn.danger:hover { color: var(--danger); }
        .mini-btn svg { width: 14px; height: 14px; }

        .sidebar-footer {
            border-top: 1px solid var(--border);
            padding: 10px 12px;
            display: flex; align-items: center; gap: 10px;
        }
        .avatar {
            width: 30px; height: 30px; border-radius: 50%;
            background: var(--brand); color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 13px; flex: 0 0 auto;
        }
        .user-meta { flex: 1; min-width: 0; }
        .user-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .user-sub { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* ---------- main ---------- */
        .main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
        .topbar {
            height: 52px; flex: 0 0 52px;
            display: flex; align-items: center; gap: 10px;
            padding: 0 16px;
            border-bottom: 1px solid transparent;
        }
        .topbar .chat-title {
            font-size: 14px; font-weight: 600; color: var(--text);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;
        }
        .topbar .badge {
            font-size: 11px; color: var(--text-muted);
            border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px;
        }

        .chat-scroll {
            flex: 1; overflow-y: auto;
            scroll-behavior: smooth;
        }
        .chat-inner {
            max-width: 768px; margin: 0 auto;
            padding: 8px 20px 32px;
        }

        /* empty state */
        .empty { text-align: center; padding: 8vh 12px 0; }
        .empty-logo { width: 46px; height: 46px; color: var(--brand); margin: 0 auto 14px; }
        .empty h1 { font-size: 24px; margin: 0 0 6px; font-weight: 700; letter-spacing: -0.4px; }
        .empty p { font-size: 13px; color: var(--text-muted); margin: 0 0 26px; }
        .suggest-grid {
            display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px; max-width: 620px; margin: 0 auto;
        }
        .suggest {
            text-align: left; font-size: 13px; line-height: 1.45;
            padding: 12px 14px; border-radius: 12px;
            border: 1px solid var(--border); background: var(--bg);
            color: var(--text);
        }
        .suggest:hover { background: var(--bg-hover); border-color: var(--border-strong); }

        /* messages */
        .msg { display: flex; margin: 18px 0; }
        .msg.user { justify-content: flex-end; }
        .msg.user .bubble {
            background: var(--bg-user); color: var(--text);
            padding: 10px 14px; border-radius: 14px;
            max-width: 82%; font-size: 14.5px; line-height: 1.65;
            white-space: pre-wrap; word-break: break-word;
        }
        .msg.assistant { justify-content: flex-start; }
        .msg.assistant .bubble {
            max-width: 100%; font-size: 14.5px; line-height: 1.75;
            color: var(--text); word-break: break-word;
        }
        .msg.assistant .bubble p { margin: 0 0 10px; }
        .msg.assistant .bubble p:last-child { margin-bottom: 0; }
        .msg.assistant .bubble ul, .msg.assistant .bubble ol { margin: 6px 0 10px; padding-left: 22px; }
        .msg.assistant .bubble li { margin: 3px 0; }
        .msg.assistant .bubble h1, .msg.assistant .bubble h2, .msg.assistant .bubble h3 {
            font-size: 15px; margin: 14px 0 8px;
        }
        .msg.assistant .bubble code {
            background: var(--bg-hover); padding: 1px 5px; border-radius: 5px;
            font-size: 13px; font-family: Consolas, monospace;
        }
        .msg.assistant .bubble pre {
            background: var(--bg-hover); padding: 12px; border-radius: 10px;
            overflow-x: auto; margin: 8px 0;
        }
        .msg.assistant .bubble pre code { background: transparent; padding: 0; }
        .msg.assistant .bubble a { color: var(--brand); }
        .msg .meta { font-size: 11px; color: var(--text-faint); margin-top: 6px; white-space: nowrap; }

        /* thinking block */
        .think {
            border: 1px solid var(--border); border-radius: 10px;
            background: var(--bg-sidebar);
            margin: 0 0 10px; overflow: hidden;
        }
        .think-head {
            display: flex; align-items: center; gap: 6px;
            width: 100%; padding: 8px 12px;
            background: transparent; border: none; color: var(--text-muted);
            font-size: 12.5px; text-align: left;
        }
        .think-head:hover { color: var(--text); }
        .think-head svg { width: 14px; height: 14px; transition: transform .15s; }
        .think.open .think-head svg { transform: rotate(90deg); }
        .think-body {
            display: none; padding: 0 14px 12px;
            font-size: 13px; line-height: 1.7; color: var(--text-muted);
            white-space: pre-wrap; max-height: 320px; overflow-y: auto;
        }
        .think.open .think-body { display: block; }

        .typing { display: inline-flex; gap: 4px; align-items: center; padding: 6px 0; }
        .typing i {
            width: 6px; height: 6px; border-radius: 50%; background: var(--text-faint);
            animation: blink 1.2s infinite ease-in-out;
        }
        .typing i:nth-child(2) { animation-delay: .2s; }
        .typing i:nth-child(3) { animation-delay: .4s; }
        @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

        /* composer */
        .composer-wrap {
            flex: 0 0 auto;
            padding: 0 20px 10px;
            background: linear-gradient(to top, var(--bg) 72%, transparent);
        }
        .composer {
            max-width: 768px; margin: 0 auto;
            border: 1px solid var(--border-strong);
            background: var(--bg-composer);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 10px 12px 8px;
            transition: border-color .15s;
        }
        .composer:focus-within { border-color: var(--brand); }
        .composer textarea {
            width: 100%; border: none; outline: none; resize: none;
            background: transparent; color: var(--text);
            font-size: 15px; line-height: 1.6;
            max-height: 180px; min-height: 24px;
            padding: 2px 4px;
        }
        .composer textarea::placeholder { color: var(--text-faint); }
        .composer-bar {
            display: flex; align-items: center; justify-content: space-between;
            gap: 8px; margin-top: 6px;
        }
        .pills { display: flex; gap: 6px; }
        .pill {
            display: inline-flex; align-items: center; gap: 5px;
            height: 28px; padding: 0 11px;
            border-radius: 999px; border: 1px solid var(--border-strong);
            background: transparent; color: var(--text-muted);
            font-size: 12.5px;
        }
        .pill svg { width: 14px; height: 14px; }
        .pill:hover { background: var(--bg-hover); }
        .pill.on {
            border-color: var(--brand); color: var(--brand);
            background: var(--brand-soft);
        }
        .composer-right { display: flex; align-items: center; gap: 8px; }
        .attach {
            width: 30px; height: 30px; border: none; background: transparent;
            color: var(--text-muted); display: inline-flex; align-items: center; justify-content: center;
            border-radius: 8px;
        }
        .attach:hover { background: var(--bg-hover); color: var(--text); }
        .attach svg { width: 18px; height: 18px; }
        .send {
            width: 34px; height: 34px; border: none; border-radius: 50%;
            background: var(--brand); color: #fff;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .send svg { width: 17px; height: 17px; }
        .send:disabled { background: var(--border-strong); }

        .disclaimer {
            text-align: center; font-size: 11px; color: var(--text-faint);
            padding: 8px 0 4px;
        }

        .hamburger { display: none; }
        /* 桌面端收起侧栏后，用顶栏按钮重新展开 */
        .app.collapsed .hamburger { display: inline-flex; }

        /* scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }

        /* mobile */
        @media (max-width: 900px) {
            .sidebar {
                position: fixed; inset: 0 auto 0 0; z-index: 40;
                transform: translateX(-100%);
                transition: transform .2s ease;
                box-shadow: var(--shadow);
                width: 280px; flex-basis: 280px;
            }
            .app.sidebar-open .sidebar { transform: translateX(0); }
            .app.collapsed .sidebar { width: 280px; flex-basis: 280px; }
            .hamburger { display: inline-flex; }
            .chat-inner { padding: 8px 14px 24px; }
            .composer-wrap { padding: 0 12px 8px; }
            .suggest-grid { grid-template-columns: 1fr; }
            .overlay {
                display: none; position: fixed; inset: 0; z-index: 30;
                background: rgba(0,0,0,.35);
            }
            .app.sidebar-open .overlay { display: block; }
        }
    </style>
</head>
<body>
<div class="app" id="app">
    <div class="overlay" id="overlay" onclick="toggleSidebar(false)"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
            <div class="brand">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="9"></circle>
                    <path d="M3.6 9h16.8M3.6 15h16.8"></path>
                    <path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"></path>
                </svg>
                <span>GlobalShop</span>
            </div>
            <div class="side-actions">
                <button class="icon-btn" id="searchToggle" title="搜索对话" aria-label="搜索对话">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>
                    </svg>
                </button>
                <button class="icon-btn" id="collapseBtn" title="收起侧栏" aria-label="收起侧栏">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M9 4v16"></path>
                    </svg>
                </button>
            </div>
        </div>

        <div class="search-wrap" id="searchWrap">
            <input class="search-input" id="sessionSearch" type="text" placeholder="搜索对话标题...">
        </div>

        <button class="new-chat" onclick="createNewSession()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 5v14M5 12h14"></path>
            </svg>
            开启新对话
        </button>

        <div class="session-list" id="sessionList"></div>

        <div class="sidebar-footer">
            <div class="avatar">G</div>
            <div class="user-meta">
                <div class="user-name">GlobalShop Support</div>
                <div class="user-sub">support@globalshop.example</div>
            </div>
            <button class="icon-btn" id="themeBtn" title="切换主题" aria-label="切换主题">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="themeIcon">
                    <circle cx="12" cy="12" r="4"></circle>
                    <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"></path>
                </svg>
            </button>
        </div>
    </aside>

    <main class="main">
        <div class="topbar">
            <button class="icon-btn hamburger" id="hamburger" title="菜单" aria-label="菜单">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
            <div class="chat-title" id="chatTitle">新对话</div>
            <span class="badge">跨境电商客服</span>
        </div>

        <div class="chat-scroll" id="chatScroll">
            <div class="chat-inner">
                <div class="empty" id="emptyState">
                    <svg class="empty-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="9"></circle>
                        <path d="M3.6 9h16.8M3.6 15h16.8"></path>
                        <path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"></path>
                    </svg>
                    <h1>今天想了解点什么？</h1>
                    <p>商品、物流、退换货、关税，随时问我</p>
                    <div class="suggest-grid" id="suggestGrid">
                        <button class="suggest" data-prompt="Where is my parcel? YT123456789CN">Where is my parcel?（查物流）</button>
                        <button class="suggest" data-prompt="我的包裹到哪了？单号 YT123456789CN">我的包裹到哪了？</button>
                        <button class="suggest" data-prompt="What is your return policy?">Return &amp; refund policy</button>
                        <button class="suggest" data-prompt="关税和增值税由谁承担？">清关税费怎么算？</button>
                        <button class="suggest" data-prompt="How long does shipping to the US take?">Shipping time to the US</button>
                        <button class="suggest" data-prompt="你们有哪些产品推荐？">看看产品推荐</button>
                    </div>
                </div>
                <div id="chatContainer"></div>
            </div>
        </div>

        <div class="composer-wrap">
            <div class="composer">
                <textarea id="messageInput" rows="1" placeholder="给 GlobalShop 发送消息"
                          maxlength="2000" autocomplete="off"></textarea>
                <div class="composer-bar">
                    <div class="pills">
                        <button class="pill on" id="thinkPill" title="展示模型的思考过程">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                                <path d="M9.5 3a6.5 6.5 0 0 0-3.7 11.8V19a2 2 0 0 0 2 2h1"></path>
                                <path d="M14.5 3a6.5 6.5 0 0 1 3.7 11.8V19a2 2 0 0 1-2 2h-1"></path>
                                <path d="M12 8v4l2 2"></path>
                            </svg>
                            深度思考
                        </button>
                        <button class="pill on" id="kbPill" title="开启后回答会检索商品与政策知识库">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                                <circle cx="12" cy="12" r="9"></circle>
                                <path d="M3 12h18M12 3c2.5 2.6 3.8 5.7 3.8 9S14.5 18.4 12 21c-2.5-2.6-3.8-5.7-3.8-9S9.5 5.6 12 3z"></path>
                            </svg>
                            智能搜索
                        </button>
                    </div>
                    <div class="composer-right">
                        <button class="attach" title="附件（暂未开放）" aria-label="附件">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                                <path d="M21 11.5l-8.5 8.5a5 5 0 0 1-7-7l8.5-8.5a3.5 3.5 0 0 1 5 5L10.5 18a2 2 0 0 1-3-3l8-8"></path>
                            </svg>
                        </button>
                        <button class="send" id="sendBtn" onclick="sendMessage()" disabled title="发送">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                                 stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 19V5M6 11l6-6 6 6"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
            <div class="disclaimer">内容由 AI 生成，请仔细甄别</div>
        </div>
    </main>
</div>

<script>
    var app = document.getElementById('app');
    var chatScroll = document.getElementById('chatScroll');
    var chatContainer = document.getElementById('chatContainer');
    var emptyState = document.getElementById('emptyState');
    var input = document.getElementById('messageInput');
    var sendBtn = document.getElementById('sendBtn');
    var sessionListEl = document.getElementById('sessionList');
    var chatTitleEl = document.getElementById('chatTitle');
    var searchInput = document.getElementById('sessionSearch');

    var currentSessionId = null;
    var busySessions = {};  // {sessionId: true} 每个会话独立忙碌状态，互不阻塞
    var unreadSessions = {};  // 后台答完、但用户还没点进去看的会话
    try {
        (JSON.parse(localStorage.getItem('gs_unread') || '[]')).forEach(function (id) {
            unreadSessions[id] = true;
        });
    } catch (e) { /* 忽略损坏的本地数据 */ }
    function saveUnread() {
        try { localStorage.setItem('gs_unread', JSON.stringify(Object.keys(unreadSessions))); }
        catch (e) { /* 忽略 */ }
    }
    var thinkOn = localStorage.getItem('gs_think') !== 'off';
    var kbOn = localStorage.getItem('gs_kb') !== 'off';
    var allSessions = [];

    /* ---------- 主题 ---------- */
    function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('gs_theme', theme);
    }
    (function initTheme() {
        var saved = localStorage.getItem('gs_theme');
        if (saved) { applyTheme(saved); return; }
        applyTheme('light');
    })();
    document.getElementById('themeBtn').addEventListener('click', function () {
        var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        applyTheme(next);
    });

    /* ---------- 侧栏 ---------- */
    document.getElementById('collapseBtn').addEventListener('click', function () {
        app.classList.toggle('collapsed');
    });
    document.getElementById('hamburger').addEventListener('click', function () {
        if (app.classList.contains('collapsed')) {
            app.classList.remove('collapsed');
            return;
        }
        app.classList.add('sidebar-open');
    });
    function toggleSidebar(open) {
        if (open) app.classList.add('sidebar-open');
        else app.classList.remove('sidebar-open');
    }
    document.getElementById('searchToggle').addEventListener('click', function () {
        var wrap = document.getElementById('searchWrap');
        wrap.classList.toggle('open');
        if (wrap.classList.contains('open')) searchInput.focus();
        else { searchInput.value = ''; renderSessions(allSessions); }
    });
    searchInput.addEventListener('input', function () {
        var q = searchInput.value.trim().toLowerCase();
        var filtered = allSessions.filter(function (s) {
            return (s.last_user_question || s.title || '').toLowerCase().indexOf(q) >= 0;
        });
        renderSessions(filtered, q.length > 0);
    });

    /* ---------- 输入框 ---------- */
    function autoGrow() {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 180) + 'px';
    }
    input.addEventListener('input', function () { autoGrow(); updateSendState(); });
    input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
            e.preventDefault();
            sendMessage();
        }
    });
    function updateSendState() {
        var ok = input.value.trim().length > 0 && !!currentSessionId && !busySessions[currentSessionId];
        sendBtn.disabled = !ok;
    }

    /* ---------- 胶囊按钮 ---------- */
    function syncPills() {
        document.getElementById('thinkPill').classList.toggle('on', thinkOn);
        document.getElementById('kbPill').classList.toggle('on', kbOn);
    }
    document.getElementById('thinkPill').addEventListener('click', function () {
        thinkOn = !thinkOn;
        localStorage.setItem('gs_think', thinkOn ? 'on' : 'off');
        syncPills();
    });
    document.getElementById('kbPill').addEventListener('click', function () {
        kbOn = !kbOn;
        localStorage.setItem('gs_kb', kbOn ? 'on' : 'off');
        syncPills();
    });
    syncPills();

    /* ---------- 会话 ---------- */
    function uuid() {
        if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
        return 'web_' + Date.now() + '_' + Math.random().toString(16).slice(2);
    }

    function createNewSession() {
        currentSessionId = uuid();
        localStorage.setItem('gs_current_session', currentSessionId);
        chatContainer.innerHTML = '';
        emptyState.style.display = 'block';
        chatTitleEl.textContent = '新对话';
        if (window.innerWidth <= 900) toggleSidebar(false);
        refreshSessions();
        updateSendState();
        input.focus();
    }

    function groupLabel(ts) {
        if (!ts) return '更早';
        var d = new Date(String(ts).replace(' ', 'T'));
        if (isNaN(d.getTime())) return '更早';
        var now = new Date();
        var startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        var startYesterday = new Date(startToday.getTime() - 86400000);
        var start7 = new Date(startToday.getTime() - 6 * 86400000);
        if (d >= startToday) return '今天';
        if (d >= startYesterday) return '昨天';
        if (d >= start7) return '7 天内';
        return '更早';
    }

    async function refreshSessions() {
        try {
            var resp = await fetch('/api/sessions');
            if (!resp.ok) return;
            var data = await resp.json();
            allSessions = data.sessions || [];
            renderSessions(allSessions);
        } catch (e) {
            console.warn('会话列表加载失败', e);
        }
    }

    function renderSessions(sessions, highlight) {
        sessionListEl.innerHTML = '';
        var groups = { '今天': [], '昨天': [], '7 天内': [], '更早': [] };
        sessions.forEach(function (s) { groups[groupLabel(s.updated_at || s.created_at)].push(s); });

        Object.keys(groups).forEach(function (label) {
            var items = groups[label];
            if (!items.length) return;
            var labelEl = document.createElement('div');
            labelEl.className = 'session-group-label';
            labelEl.textContent = label;
            sessionListEl.appendChild(labelEl);

            items.forEach(function (s) {
                var title = (s.last_user_question || s.title || '新对话').trim() || '新对话';
                var item = document.createElement('div');
                item.className = 'session-item' + (s.session_id === currentSessionId ? ' active' : '');
                item.title = title;

                var titleEl = document.createElement('div');
                titleEl.className = 'session-title';
                titleEl.textContent = title;
                item.appendChild(titleEl);

                // 状态点：思考中（脉冲蓝）/ 已回答未读（绿）
                if (busySessions[s.session_id]) {
                    var st = document.createElement('span');
                    st.className = 'session-status thinking';
                    st.title = '正在思考';
                    item.appendChild(st);
                } else if (unreadSessions[s.session_id]) {
                    var st2 = document.createElement('span');
                    st2.className = 'session-status done';
                    st2.title = '已回答完毕，点击查看';
                    item.appendChild(st2);
                }

                var actions = document.createElement('div');
                actions.className = 'session-actions';

                var renameBtn = document.createElement('button');
                renameBtn.className = 'mini-btn';
                renameBtn.title = '重命名';
                renameBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
                renameBtn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    renameSession(s.session_id, title);
                });

                var delBtn = document.createElement('button');
                delBtn.className = 'mini-btn danger';
                delBtn.title = '删除';
                delBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>';
                delBtn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    deleteSession(s.session_id);
                });

                actions.appendChild(renameBtn);
                actions.appendChild(delBtn);
                item.appendChild(actions);

                item.addEventListener('click', function () { loadSession(s.session_id); });
                sessionListEl.appendChild(item);
            });
        });

        if (!sessions.length) {
            var empty = document.createElement('div');
            empty.className = 'session-group-label';
            empty.textContent = highlight ? '没有匹配的对话' : '暂无对话';
            sessionListEl.appendChild(empty);
        }
    }

    async function renameSession(sessionId, oldTitle) {
        var title = window.prompt('重命名对话', oldTitle || '');
        if (title === null) return;
        title = title.trim();
        if (!title) return;
        try {
            var resp = await fetch('/api/sessions/' + encodeURIComponent(sessionId) + '/rename', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: title })
            });
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            if (sessionId === currentSessionId) chatTitleEl.textContent = title;
            refreshSessions();
        } catch (e) {
            alert('重命名失败：' + e.message);
        }
    }

    async function deleteSession(sessionId) {
        if (!window.confirm('删除这个对话？此操作不可恢复。')) return;
        try {
            var resp = await fetch('/api/sessions/' + encodeURIComponent(sessionId) + '/delete', { method: 'POST' });
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            if (sessionId === currentSessionId) {
                createNewSession();
            } else {
                refreshSessions();
            }
        } catch (e) {
            alert('删除失败：' + e.message);
        }
    }

    async function loadSession(sessionId) {
        currentSessionId = sessionId;
        localStorage.setItem('gs_current_session', sessionId);
        delete unreadSessions[sessionId];
        saveUnread();
        chatContainer.innerHTML = '';
        emptyState.style.display = 'none';
        if (window.innerWidth <= 900) toggleSidebar(false);
        updateSendState();
        try {
            var resp = await fetch('/api/sessions/' + encodeURIComponent(sessionId));
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            var data = await resp.json();
            var session = data.session || {};
            chatTitleEl.textContent = (session.title || '对话');
            (session.conversation_history || []).forEach(function (m) {
                addMessage(m.is_user ? 'user' : 'assistant', m.content, m.timestamp);
            });
            // 该会话还在生成中（用户切走又切回来）
            if (busySessions[sessionId]) addTyping();
            scrollToBottom();
            refreshSessions();
        } catch (e) {
            addMessage('assistant', '加载对话失败：' + e.message);
        }
    }

    /* ---------- 渲染 ---------- */
    function escapeHtml(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function renderMarkdown(text) {
        var safe = escapeHtml(text);
        var blocks = safe.split(/```/);
        var out = '';
        blocks.forEach(function (block, idx) {
            if (idx % 2 === 1) {
                out += '<pre><code>' + block.replace(/^\n+|\n+$/g, '') + '</code></pre>';
            } else {
                out += inlineMarkdown(block);
            }
        });
        return out;
    }

    function inlineMarkdown(text) {
        var lines = text.split('\n');
        var html = '';
        var inList = false;
        lines.forEach(function (raw) {
            var line = raw;
            var heading = line.match(/^(#{1,3})\s+(.*)$/);
            var bullet = line.match(/^\s*[-*]\s+(.*)$/);
            var numbered = line.match(/^\s*\d+\.\s+(.*)$/);

            if (inList && !bullet && !numbered) { html += '</ul>'; inList = false; }

            if (heading) {
                var level = Math.min(heading[1].length + 1, 4);
                html += '<h' + level + '>' + inlineFormat(heading[2]) + '</h' + level + '>';
            } else if (bullet || numbered) {
                if (!inList) { html += '<ul>'; inList = true; }
                html += '<li>' + inlineFormat((bullet || numbered)[1]) + '</li>';
            } else if (line.trim() === '') {
                html += '';
            } else {
                html += '<p>' + inlineFormat(line) + '</p>';
            }
        });
        if (inList) html += '</ul>';
        return html;
    }

    function inlineFormat(text) {
        return text
            .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
            .replace(/`([^`]+)`/g, '<code>$1</code>')
            .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
            // 非 http(s) 的 Markdown 链接（如模型编造的 # 链接）降级为纯文本
            .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1');
    }

    function addMessage(role, content, ts, reasoning, elapsed, agent) {
        emptyState.style.display = 'none';
        var wrap = document.createElement('div');
        wrap.className = 'msg ' + role;

        var bubble = document.createElement('div');
        bubble.className = 'bubble';

        if (reasoning && role === 'assistant') {
            var think = document.createElement('div');
            think.className = 'think';
            var head = document.createElement('button');
            head.className = 'think-head';
            head.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>'
                + '<span>已思考' + (elapsed ? '（用时 ' + elapsed + ' 秒）' : '') + '</span>';
            var body = document.createElement('div');
            body.className = 'think-body';
            body.textContent = reasoning;
            head.addEventListener('click', function () { think.classList.toggle('open'); });
            think.appendChild(head);
            think.appendChild(body);
            bubble.appendChild(think);
        }

        if (role === 'user') {
            bubble.textContent = content;
        } else {
            var contentEl = document.createElement('div');
            contentEl.innerHTML = renderMarkdown(content);
            bubble.appendChild(contentEl);
        }

        wrap.appendChild(bubble);

        var metaText = [];
        if (agent) metaText.push(agent);
        if (ts) metaText.push(ts);
        if (metaText.length) {
            var meta = document.createElement('div');
            meta.className = 'meta';
            meta.textContent = metaText.join(' · ');
            wrap.appendChild(meta);
        }
        chatContainer.appendChild(wrap);
        return wrap;
    }

    function addTyping() {
        if (document.getElementById('typingMsg')) return;
        var wrap = document.createElement('div');
        wrap.className = 'msg assistant';
        wrap.id = 'typingMsg';
        var bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerHTML = '<div class="typing"><i></i><i></i><i></i></div>';
        wrap.appendChild(bubble);
        chatContainer.appendChild(wrap);
        scrollToBottom();
    }
    function removeTyping() {
        var el = document.getElementById('typingMsg');
        if (el) el.remove();
    }
    function scrollToBottom() {
        chatScroll.scrollTop = chatScroll.scrollHeight;
    }

    /* ---------- 发送 ---------- */
    async function sendMessage() {
        var message = input.value.trim();
        var sid = currentSessionId;
        if (!message || !sid || busySessions[sid]) return;

        input.value = '';
        autoGrow();
        busySessions[sid] = true;
        delete unreadSessions[sid];
        saveUnread();
        updateSendState();

        addMessage('user', message);
        addTyping();
        scrollToBottom();

        try {
            var resp = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: message,
                    session_id: sid,
                    use_kb: kbOn
                })
            });
            var data = await resp.json();

            if (!resp.ok) throw new Error(data.error || ('HTTP ' + resp.status));

            var newSid = data.thread_id || data.session_id;
            if (newSid && newSid !== sid) {
                // 后端把会话 ID 规范成了 UUID：通知当前会话与本地存储
                if (sid === currentSessionId) currentSessionId = newSid;
                localStorage.setItem('gs_current_session', newSid);
            }

            // 答完时用户已经切到别的会话 → 标记为「已回答未读」
            var target = newSid || sid;
            if (target !== currentSessionId) {
                unreadSessions[target] = true;
                saveUnread();
            }

            // 用户可能已经切到别的会话：只在原会话仍可见时渲染
            if (sid === currentSessionId || newSid === currentSessionId) {
                removeTyping();
                if (data.error) {
                    addMessage('assistant', '抱歉，系统出现错误：' + data.error);
                } else if (data.response) {
                    addMessage('assistant', data.response, '', thinkOn ? data.reasoning : '', data.elapsed, data.agent);
                } else {
                    addMessage('assistant', '抱歉，系统返回了空响应，请稍后重试。');
                }
                scrollToBottom();
            }
        } catch (e) {
            if (sid === currentSessionId) {
                removeTyping();
                addMessage('assistant', '抱歉，请求失败：' + e.message);
            }
        } finally {
            busySessions[sid] = false;
            refreshSessions();
            if (sid === currentSessionId) {
                removeTyping();
                updateSendState();
                scrollToBottom();
                input.focus();
            }
        }
    }

    /* ---------- 建议问题 ---------- */
    document.getElementById('suggestGrid').addEventListener('click', function (e) {
        var btn = e.target.closest('.suggest');
        if (!btn) return;
        input.value = btn.getAttribute('data-prompt') || '';
        autoGrow();
        updateSendState();
        input.focus();
    });

    /* ---------- 初始化 ---------- */
    window.addEventListener('load', function () {
        autoGrow();
        syncPills();
        refreshSessions();
        var last = localStorage.getItem('gs_current_session');
        if (last) {
            loadSession(last);
        } else {
            createNewSession();
        }
        updateSendState();
    });
</script>
</body>
</html>
